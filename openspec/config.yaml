# OpenSpec / SDD configuration for the "workouts" project.
# Generated by the SDD init phase (greenfield initialization).
# This file is the authoritative SDD/testing configuration for later phases.
# Do not destructively rewrite it; extend it deliberately instead.

project:
  name: workouts
  status: greenfield
  description: >-
    Offline-first workout interval timer PWA. Classic, Tabata, and Custom
    interval timers, routines, session history, and phase audio cues via
    Web Audio beeps. Installable PWA (web app manifest + service worker).
  package_manager: pnpm

stack:
  framework: nextjs-15 (App Router) + TypeScript
  pwa: web app manifest + service worker (Serwist is the candidate library; not yet installed)
  styling: tailwind-css-v4 + shadcn/ui
  state: zustand (client state + persistence)
  forms: react-hook-form + zod
  language: typescript (strict)

sdd:
  artifact_store: openspec
  execution_mode: auto
  delivery_strategy: ask-on-risk
  # Chain strategy is deferred until chaining is explicitly selected.
  chain_strategy: deferred
  review_budget_lines: 400
  strict_tdd: true
  strict_tdd_status: >-
    Declared active from init. The test runner was installed during U1
    (vitest 5 + RTL 16 + jsdom 30; `pnpm test` = vitest run verified by the
    U1 smoke test), so RED/GREEN evidence obligations are enforceable for
    every unit from U2 onward. U1 itself was RED-exempt per phase_rules
    (greenfield scaffold before the runner existed).
  human_controlled_gates:
    - consent / authorization decisions
    - security-sensitive changes
    - destructive or publishing actions (npm publish, releases)
    - ambiguous-scope expansion
    - 'size:exception (never inferred; requires explicit acceptance)'

testing:
  # Installed during U1 (apply scaffold). Evidence below is from the U1 runner smoke test.
  installed: true
  status: installed
  runner: vitest
  command: pnpm test
  command_detail: vitest run (non-watch, CI-safe)
  planned_stack:
    - vitest
    - '@testing-library/react'
    - jsdom
  install_note: >-
    Installed in U1 of change add-pwa-workout-timer (PR 1, branch u1-scaffold).
    Versions: vitest 5.0.0, @vitejs/plugin-react 6.1.1,
    @testing-library/react 16.3.3, @testing-library/jest-dom 7.0.1,
    jsdom 30.0.1, fake-indexeddb 6.2.5, @playwright/test 1.63.0,
    typescript 5.9.3. Evidence: `pnpm test` executes `vitest run`; the
    runner smoke test src/app/page.test.tsx passes — "Test Files 1 passed
    (1), Tests 1 passed (1), Duration 1.02s". `pnpm build` and `pnpm dev`
    verified green on the scaffold. Playwright offline runner
    (`pnpm test:offline`) is configured; its spec file lands in U12.
    Note: typescript was pinned to ^5 (5.9.3) because typescript@7 (Go
    preview) broke next.config.ts loading in `next build`.

phase_rules:
  pipeline: clarify > explore > proposal > spec > design > tasks > apply > verify > archive
  rules:
    clarify: Confirm scope, constraints, acceptance criteria, and non-goals before any implementation work.
    explore: Read-only inspection of the workspace; no production code changes.
    proposal: Produce an OpenSpec-style proposal artifact before specs; wait for approval when scope is ambiguous.
    spec: Requirements with acceptance scenarios; specs precede design.
    design: Technical decisions (architecture, data model, PWA/offline strategy) recorded as design artifacts.
    tasks: Break into small, verifiable work units sized within the review budget.
    apply: >-
      Strict TDD once the runner exists: RED, GREEN, TRIANGULATE, REFACTOR,
      with recorded test evidence. The scaffolding step itself (create-next-app,
      dependency install) is exempt from RED-first but must be followed by
      a smoke test proving the runner works.
    verify: Run the full test suite and verify acceptance criteria; report evidence, not claims.
    archive: Record outcomes, decisions, and deviations; keep artifacts under openspec/.
  delegation:
    rule: Parent/orchestrator owns delegation; phase executors never launch child subagents.
    skill_paths: Parent must pass exact SKILL.md paths (from .atl/skill-registry.md) to phase executors.

context:
  project_context_artifact: openspec/context/workouts.md
  skill_registry: .atl/skill-registry.md
